name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # Archive directly: upload-pages-artifact v3 delegates to a
      # mutable upload-artifact@v4 tag, despite its own immutable outer pin.
      - name: Archive Pages
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import tarfile

          def include(entry):
              return None if {'.git', '.github'}.intersection(entry.name.split('/')) else entry

          with tarfile.open(os.path.join(os.environ['RUNNER_TEMP'], 'artifact.tar'),
                            'w', dereference=True) as archive:
              archive.add('docs', arcname='.', filter=include)
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          archive: true
          retention-days: 1
          if-no-files-found: error

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
